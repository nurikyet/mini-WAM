[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miniwam"
version = "0.1.0"
description = "One-action and two-action pixel world/action model experiments"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy==1.26.4", "torch==2.7.1", "Pillow==11.3.0"]

[project.scripts]
miniwam = "miniwam.cli:main"

[tool.setuptools.packages.find]
include = ["miniwam*"]
